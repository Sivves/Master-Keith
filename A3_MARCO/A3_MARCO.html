<html>
    <head>
        <title></title>
        <style>
            li.a {list-style-type: upper-roman;}
            li.b {list-style-type: lower-roman;}
            li.c {list-style-type: lower-alpha;}
            li.d {list-style-type: decimal;}
            a:link{
                color:red;
            }
            a:visited{
                color:red;
                font-style: italic;
            }
            a:hover{
                color:rgb(116, 1, 1);
                font-style: italic;
                font-weight: bold;
            }
            a:active{
                color:rgb(116, 1, 1);
                font-style: italic;
            }
        </style>
        <script src="https://kit.fontawesome.com/f67ef70a8d.js" crossorigin="anonymous"></script>
    </head>
    <body>
        <i class="fa-brands fa-fort-awesome">Hello guys this is top 4 list style types</i>   
        <ol>
            <li class="d">Decimal is the best. Number 1.
                <a href="https://en.wikipedia.org/wiki/Decimal">Decimal</a>
            </li>
            <li class="a">Upper roman is a close second very cool
            </li>
            <li class="b">Lower roman I dont like the same way as the other, still good
                <a href="https://en.wikipedia.org/wiki/Roman_numerals">For both upper and lower roman</a>
            </li>
            <li class="c">I dont like lower alpha.
                <a href="https://en.wikipedia.org/wiki/Alphanumericals">Alpha Numerals</a>
            </li>
        </ol>
        <p>thank you for reading</p>
    </body>
</html>
